name: Build Zero-Cost Chat Intro Translations

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language to build"
        required: true
        type: choice
        default: ES
        options:
          - ES
          - FR
          - DE
          - JA
          - KO
          - ALL
      max_characters:
        description: "10 = safe test; 0 = all missing/outdated official companions"
        required: true
        default: "10"
        type: string

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHAT_TRANSLATION_LANGUAGE: ${{ inputs.language }}
      CHAT_TRANSLATION_MAX_CHARACTERS: ${{ inputs.max_characters }}
      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: everbond-m2m100-418m-v1

      - name: Install CPU translation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.40,<5" sentencepiece requests accelerate

      - name: Translate chat intros offline
        run: python scripts/translate-chat-intros-offline.py
