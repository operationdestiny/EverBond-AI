name: Maintain official characters

on:
  push:
    branches:
      - main
    paths:
      - "data/characters/*.json"
      - "public/character-assets/**"
      - "scripts/apply-retired-character-removals.mjs"
      - "scripts/_character-category-overrides.mjs"
      - ".github/workflows/purge-retired-characters.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply retirements and category overrides
        run: node scripts/apply-retired-character-removals.mjs --local-only

      - name: Commit permanent source maintenance
        run: |
          if git diff --quiet; then
            echo "Official character sources already match the maintenance rules."
            exit 0
          fi
          git config user.name "everbond-character-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/characters public/character-assets
          git commit -m "Apply permanent character maintenance"
          git push
